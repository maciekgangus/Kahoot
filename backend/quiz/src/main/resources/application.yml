spring:
  application:
    name: quiz

  datasource:
    url: jdbc:postgresql://localhost:5432/quiz
    username: quiz
    password: quiz
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  web:
    cors:
      allowed-origins: "http://localhost:5173"

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080
